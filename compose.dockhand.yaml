name: bluechart
services:
  viewer:
    build:
      context: ${BUILD_CONTEXT:-.}
    image: ${VIEWER_IMAGE:-local/bluechart-viewer:latest}
    container_name: bluechart
    command: [serve, --chart-config, /config/charts.json, --bind, 0.0.0.0, --chart, /charts/chart.img, --charts-dir, /charts, --cache-dir, /cache, --overview, /cache/overview.sqlite3, --allowed-host, "${PUBLIC_HOST:-viewer.example.test}", --allowed-host, "bluechart:8765"]
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - type: bind
        source: ${CHART_CONFIG:-./chart-config.example.json}
        target: /config/charts.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CACHE_DIR:-./cache}
        target: /cache
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CHARTS_DIR:-./charts}
        target: /charts
        read_only: true
        bind:
          create_host_path: false
    networks:
      - proxy
    mem_limit: 512m
    cpus: 1
    pids_limit: 64
    healthcheck:
      test: [CMD, bluechart, healthcheck]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
networks:
  proxy:
    name: ${PROXY_NETWORK:-proxy}
    external: true
